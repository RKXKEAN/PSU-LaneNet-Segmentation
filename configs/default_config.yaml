# Configuration for PSU-LaneNet Training & Inference
dataset:
  images_dir: "Dataset/Sampling Image"
  labels_dir: "Dataset/Labels Data/Datatset/labels/train"
  train_split: 0.8
  val_split: 0.2
  seed: 42
  input_height: 384
  input_width: 640
  num_classes: 6
  class_names:
    0: "Background"
    1: "Line_L"
    2: "Line_C"
    3: "Line_R"
    4: "Lane"
    5: "Sideway"
  class_colors:
    0: [0, 0, 0]        # Black
    1: [255, 0, 0]      # Red (Line_L)
    2: [255, 255, 0]    # Yellow (Line_C)
    3: [0, 165, 255]    # Orange (Line_R)
    4: [0, 255, 0]      # Green (Lane)
    5: [255, 0, 255]    # Magenta (Sideway)

model:
  name: "PSULaneNet"
  num_classes: 6
  stem_channels: 32
  channels: [48, 96, 160]

training:
  epochs: 35
  batch_size: 8
  learning_rate: 0.001
  min_lr: 0.00001
  weight_decay: 0.0001
  focal_gamma: 2.0
  dice_weight: 1.0
  focal_weight: 1.0
  save_dir: "checkpoints"
  log_dir: "runs/psu_lanenet"
  device: "cuda" # fallback to cpu if cuda unavailable
